[project]
name = "fiqa-api"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.163.1",
    "uvicorn==0.54.0",
    "datasets==5.2.0",
    "scikit-learn==1.9.1",
    "numpy==2.4.6",
    "nltk==3.9.2",
    "faiss-cpu==1.16.0",
    "sentence-transformers==6.3.0",
    "torch==2.9.1+cpu",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.vercel]
entrypoint = "main:app"
